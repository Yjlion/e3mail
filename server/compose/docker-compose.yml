# docker compose up -d --build
# With iroh's relay too (scripts/p2p-e2e.py --relay):
#   docker compose --profile relay up -d --build
# With places to back up to (scripts/backup-e2e.py):
#   docker compose --profile backup up -d
# Users alice, bob, carol, dana @e3.test, password "pw". Self-signed TLS:
# clients must be told to accept it (e3mail-cli add --insecure).
# An explicit project name: without it Compose names the project after this
# directory ("compose"), and any other checkout with a server/compose/ of its
# own would be treated as the same project and have its containers replaced.
name: e3mail-test

services:
  mail:
    build: .
    image: e3mail/test-mail:latest
    container_name: e3mail-test-mail
    hostname: mail.e3.test
    environment:
      E3_USERS: "alice bob carol dana"
      E3_PASSWORD: "pw"
    ports:
      - "127.0.0.1:1465:465"   # SMTP, implicit TLS
      - "127.0.0.1:1587:587"   # SMTP submission, STARTTLS
      - "127.0.0.1:1993:993"   # IMAP, implicit TLS
      - "127.0.0.1:1143:143"   # IMAP, STARTTLS
      - "127.0.0.1:1995:995"   # POP3, implicit TLS
      - "127.0.0.1:1110:110"   # POP3, STARTTLS

  # iroh's relay, for devices that reach each other only through it. Only
  # with --profile relay; the first build compiles it (a few minutes).
  relay:
    profiles: [relay]
    build: relay
    image: e3mail/test-relay:latest
    container_name: e3mail-test-relay
    environment:
      RUST_LOG: "iroh_relay=info"   # shows each client that connects
    ports:
      - "127.0.0.1:3340:3340"

  # Backup destinations (ADR 0020), only with --profile backup. Throwaway
  # credentials; never expose them.
  # An S3 gateway that checks Signature Version 4 (MinIO no longer
  # publishes images); e3mail makes the bucket.
  s3:
    profiles: [backup]
    image: versity/versitygw:v1.8.0
    container_name: e3mail-test-s3
    entrypoint: ["sh", "-c", "mkdir -p /data && exec versitygw --access e3backup --secret e3backup-secret --port :7070 posix /data"]
    ports:
      - "127.0.0.1:17070:7070"
  webdav:
    profiles: [backup]
    image: rclone/rclone:1.69.1
    container_name: e3mail-test-webdav
    # No directory cache: the tests empty /data under it.
    command: serve webdav /data --addr :8080 --user e3 --pass pw --dir-cache-time 0s
    ports:
      - "127.0.0.1:18080:8080"
  sftp:
    profiles: [backup]
    image: atmoz/sftp:alpine
    container_name: e3mail-test-sftp
    command: e3:pw:::backup
    ports:
      - "127.0.0.1:12222:22"
