[package]
name = "e3p2p"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
iroh = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"
