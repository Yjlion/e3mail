name: Windows dependencies
description: >
  vcpkg's packages and RNP, built once and kept between runs. Botan and ICU
  take most of half an hour to build, so both CI and the release use this,
  and a release on a tag restores what main's CI saved.

inputs:
  rnp-version:
    description: The RNP tag scripts/build-rnp.sh builds.
    required: true
  bundle-dlls:
    description: Pass E3MAIL_BUNDLE_DLLS_FROM, so the install carries these DLLs.
    default: "false"

runs:
  using: composite
  steps:
    # The whole result, keyed on everything that decides what gets built. The
    # project's version is not in vcpkg.json, so a version bump does not miss.
    - name: Cache dependencies
      id: deps
      uses: actions/cache@v4
      with:
        path: |
          vcpkg_installed
          deps
        key: windeps-v2-${{ inputs.rnp-version }}-${{ hashFiles('vcpkg.json', 'scripts/build-rnp.sh', '.github/actions/windows-deps/action.yml') }}

    # Built packages one by one: when the cache above misses because one
    # dependency changed, only that one is built again.
    - name: Cache vcpkg packages
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ hashFiles('vcpkg.json', '.github/actions/windows-deps/action.yml') }}
        restore-keys: vcpkg-bin-

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      shell: bash
      env:
        RNP_VERSION: ${{ inputs.rnp-version }}
      run: |
        VCPKG="$VCPKG_INSTALLATION_ROOT"
        INSTALLED="$GITHUB_WORKSPACE/vcpkg_installed"
        TOOLCHAIN="$VCPKG/scripts/buildsystems/vcpkg.cmake"
        mkdir -p vcpkg-bincache
        export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE\\vcpkg-bincache,readwrite"
        # Release builds only: neither CI nor the release links debug
        # libraries, and the debug half doubled the build.
        # Manifest mode: installs what vcpkg.json lists into ./vcpkg_installed.
        "$VCPKG/vcpkg" install --triplet x64-windows-release --host-triplet x64-windows-release
        # RNP's own tree has no manifest: point it at the packages just installed.
        scripts/build-rnp.sh "$GITHUB_WORKSPACE/deps" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows-release \
            -DVCPKG_HOST_TRIPLET=x64-windows-release \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$INSTALLED"

    - name: Use dependencies
      shell: bash
      run: |
        INSTALLED="$GITHUB_WORKSPACE/vcpkg_installed"
        TOOLCHAIN="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        ARGS="-DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN -DVCPKG_TARGET_TRIPLET=x64-windows-release"
        ARGS+=" -DVCPKG_HOST_TRIPLET=x64-windows-release -DVCPKG_INSTALLED_DIR=$INSTALLED"
        if [[ "${{ inputs.bundle-dlls }}" == "true" ]]; then
          ARGS+=" -DE3MAIL_BUNDLE_DLLS_FROM=$GITHUB_WORKSPACE/deps/bin;$INSTALLED/x64-windows-release/bin"
        fi
        echo "E3_CMAKE_ARGS=$ARGS" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/deps/bin" >> "$GITHUB_PATH"
        echo "$INSTALLED/x64-windows-release/bin" >> "$GITHUB_PATH"
