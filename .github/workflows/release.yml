name: Release

# Builds the installers and portable archives for a release and attaches
# them, each with a SHA-256 checksum. Nothing is code-signed.
#
# To release: draft a new release on GitHub with a new tag vX.Y.Z and publish
# it (as a pre-release or not). The tag is the version; nothing in the source
# names it. Run by hand, it builds without publishing, as the version given.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Build as this version, X.Y.Z (nothing is published)"
        required: false

permissions:
  contents: write

env:
  QT_VERSION: "6.10.3"
  RNP_VERSION: "v0.18.1"
  # r27c: r26b's libc++ cannot build Botan 3.
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  # The version, from the release's tag (or the input, run by hand). Every
  # build gets it as E3MAIL_VERSION. The Android version code is made from it
  # (src/app/CMakeLists.txt), and Google Play refuses a code it has seen, so
  # each release must be higher than the last one uploaded.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$INPUT"
          fi
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::\"$v\" is not a version: name the tag vX.Y.Z, with Y and Z below 100."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: ${v:-none given; the build says 0.0.0}"

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }   # the oldest glibc we target, for the AppImage
          - { name: Windows, os: windows-2022 }
          - { name: macOS, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      # Sync between devices is a Rust crate (src/p2p, ADR 0010), built by
      # cargo through Corrosion.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/p2p
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsqlite3-dev libgl1-mesa-dev libxkbcommon-dev \
              libjson-c-dev libbotan-2-dev zlib1g-dev libbz2-dev libicu-dev libfuse2 file
          RNP_CRYPTO_BACKEND=botan scripts/build-rnp.sh "$HOME/deps"
          echo "CMAKE_PREFIX_PATH=$HOME/deps" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja rnp sqlite pkg-config icu4c
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-deps
        with:
          rnp-version: ${{ env.RNP_VERSION }}
          bundle-dlls: "true"

      - name: Build
        shell: bash
        env:
          E3_VERSION: ${{ needs.version.outputs.version }}
        run: |
          read -r -a E3_ARGS <<< "${E3_CMAKE_ARGS:-}"
          cmake --preset release -DE3MAIL_DEPLOY_QT=${{ runner.os != 'Linux' && 'ON' || 'OFF' }} \
              "-DE3MAIL_VERSION=$E3_VERSION" "${E3_ARGS[@]}"
          cmake --build --preset release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          (cd build/release && cpack -G "DEB;TGZ")
          packaging/linux/build-appimage.sh build/release
          mkdir -p dist && mv build/release/*.deb* build/release/*.tar.gz* *.AppImage* dist/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          (cd build/release && cpack -G DragNDrop)
          mkdir -p dist && mv build/release/*.dmg* dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          (cd build/release && cpack -G NSIS)
          # The portable archive: the install tree plus portable.txt, so the
          # app keeps its data beside itself and leaves nothing on the machine.
          # Qt's deploy step needs an absolute prefix.
          cmake --install build/release --prefix "$(pwd -W)/portable/e3mail"
          cp packaging/windows/portable.txt portable/e3mail/bin/
          mkdir -p dist
          (cd portable && 7z a ../dist/e3mail-windows-x64-portable.zip e3mail)
          (cd dist && sha256sum e3mail-windows-x64-portable.zip > e3mail-windows-x64-portable.zip.sha256)
          mv build/release/*-win64.exe* dist/  # the installer, not the built programs

      - uses: actions/upload-artifact@v4
        with:
          name: e3mail-${{ matrix.name }}
          path: dist/*

  # The Android packages (ADR 0016), one per ABI: arm64-v8a for phones,
  # x86_64 for emulators and Chromebooks.
  android:
    name: Android ${{ matrix.abi }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: x86_64, qt-arch: android_x86_64, preset: android-x64, rust-target: x86_64-linux-android }
          - { abi: arm64-v8a, qt-arch: android_arm64_v8a, preset: android-arm64, rust-target: aarch64-linux-android }
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/p2p
          key: ${{ matrix.rust-target }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf-archive
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          autodesktop: true
          target: android
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Qt paths
        run: |
          echo "QT_ANDROID=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_ANDROID_ROOT=$(dirname "$QT_ROOT_DIR")" >> "$GITHUB_ENV"
          test -n "$QT_HOST_PATH"

      - name: Dependencies
        uses: ./.github/actions/android-deps
        with:
          abi: ${{ matrix.abi }}
          rnp-version: ${{ env.RNP_VERSION }}

      # A release key kept in the repository's secrets, so that each release
      # installs over the last (ADR 0016, amendment 2026-10-08). Without the
      # secrets the package is signed with a throwaway key, and says so.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            base64 -d <<< "$KEYSTORE_BASE64" > "$ks"
            alias="$KEY_ALIAS" store="$KEYSTORE_PASS" key="${KEY_PASS:-$KEYSTORE_PASS}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway key, and will not install over another release."
            alias=throwaway store=android key=android
            keytool -genkeypair -keystore "$ks" -storepass "$store" -keypass "$key" \
                -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=e3mail throwaway"
          fi
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$ks"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$alias"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$store"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$key"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          E3_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cmake --preset ${{ matrix.preset }} "-DE3MAIL_VERSION=$E3_VERSION"
          cmake --build --preset ${{ matrix.preset }}
          mkdir -p dist
          apk=dist/e3mail-android-${{ matrix.abi }}.apk
          cp "$(find build/${{ matrix.preset }} -name '*-signed.apk' | head -1)" "$apk"
          (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: e3mail-Android-${{ matrix.abi }}
          path: dist/*

      # The bundle for Google Play (ADR 0016, amendment 2026-10-12): arm64
      # only, signed with the upload key; Google re-signs it with the app
      # signing key it keeps. Not part of the GitHub release.
      - name: Bundle for Google Play
        if: matrix.abi == 'arm64-v8a'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASS }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASS }}
        run: |
          if [[ -z "$UPLOAD_KEYSTORE_BASE64" ]]; then
            echo "::warning::PLAY_UPLOAD_KEYSTORE_BASE64 is not set: no bundle for Google Play."
            exit 0
          fi
          cmake --build build/${{ matrix.preset }} --target aab
          ks="$RUNNER_TEMP/upload.keystore"
          base64 -d <<< "$UPLOAD_KEYSTORE_BASE64" > "$ks"
          mkdir -p play
          aab=play/e3mail-${{ github.ref_name }}.aab
          cp "$(find build/${{ matrix.preset }} -path '*/outputs/bundle/release/*.aab' | head -1)" "$aab"
          jarsigner -keystore "$ks" -storepass "$UPLOAD_KEYSTORE_PASS" -keypass "${UPLOAD_KEY_PASS:-$UPLOAD_KEYSTORE_PASS}" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$UPLOAD_KEY_ALIAS"
          jarsigner -verify "$aab"

      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: play-bundle
          path: play/*.aab
          if-no-files-found: ignore

  publish:
    needs: [package, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: e3mail-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Google Play's internal testing track, as a draft: a person releases it to
  # testers, and promotes it, in Play Console. Needs a service account with
  # release rights on the app (ADR 0016, amendment 2026-10-12).
  play:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Service account
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing goes to Google Play."
      - uses: actions/download-artifact@v4
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          name: play-bundle
          path: play
      - uses: r0adkll/upload-google-play@v1
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.e3mail.e3mail
          releaseFiles: play/*.aab
          releaseName: ${{ github.ref_name }}
          tracks: internal
          status: draft
