name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push supersedes the runs still building the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"
  RNP_VERSION: "v0.18.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2022 }
          - { name: macOS, os: macos-14 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsqlite3-dev gnupg \
              libgl1-mesa-dev libxkbcommon-dev libjson-c-dev libbotan-2-dev zlib1g-dev libbz2-dev
          # Distribution RNP where available; otherwise build it.
          if ! sudo apt-get install -y librnp-dev; then
            RNP_CRYPTO_BACKEND=botan scripts/build-rnp.sh "$HOME/deps"
          fi
          echo "CMAKE_PREFIX_PATH=$HOME/deps" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja rnp sqlite pkg-config gnupg

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Botan and RNP take most of a Windows run to build; keep them between
      # runs, keyed on everything that decides what gets built.
      - name: Cache dependencies (Windows)
        if: runner.os == 'Windows'
        id: windeps
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            deps
          key: windeps-${{ env.RNP_VERSION }}-${{ hashFiles('vcpkg.json', 'scripts/build-rnp.sh') }}

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VCPKG="$VCPKG_INSTALLATION_ROOT"
          INSTALLED="$GITHUB_WORKSPACE/vcpkg_installed"
          TOOLCHAIN="$VCPKG/scripts/buildsystems/vcpkg.cmake"
          if [[ "${{ steps.windeps.outputs.cache-hit }}" != "true" ]]; then
            # Manifest mode: installs what vcpkg.json lists into ./vcpkg_installed.
            "$VCPKG/vcpkg" install --triplet x64-windows
            # RNP's own tree has no manifest: point it at the packages just installed.
            scripts/build-rnp.sh "$GITHUB_WORKSPACE/deps" -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows \
                -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_INSTALLED_DIR="$INSTALLED"
          fi
          echo "E3_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR=$INSTALLED" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/deps/bin" >> "$GITHUB_PATH"
          echo "$INSTALLED/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: cmake --preset ci $E3_CMAKE_ARGS

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        shell: bash
        # On failure, run the failed tests again verbosely so their output is
        # in the log whatever ctest decided to show.
        run: |
          ctest --preset ci && exit 0
          ctest --preset ci --rerun-failed -V || true
          # A suite that crashes loses its buffered output: run it function by function.
          failed=$(cut -d: -f2 build/ci/Testing/Temporary/LastTestsFailed.log 2>/dev/null)
          for t in $failed; do
            exe=$(ls build/ci/tst_$t* build/ci/tests/tst_$t* 2>/dev/null | head -1)
            [[ -n "$exe" ]] && scripts/ci-diagnose-tests.sh "$exe"
          done
          exit 1
